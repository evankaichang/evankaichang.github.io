<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evan Chang — Projects</title>
  <meta name="description" content="Mechanical engineering projects: competition robots, custom mechanisms, and electronics.">

  <!-- Link preview card, for when this URL gets pasted into a message or post. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Evan Chang — Projects">
  <meta property="og:description" content="Mechanical engineering projects: competition robots, custom mechanisms, and electronics.">
  <meta property="og:image" content="images/pick-and-place-robot/robot-complete.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚙️</text></svg>">
</head>
<body>

  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>

  <header class="hero">
    <div class="wrap">
      <p class="hero-role" id="hero-role"></p>
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-tagline" id="hero-tagline"></p>
      <nav class="hero-links" id="hero-links"></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <h2 class="section-title">Projects</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter projects by tag"></div>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p id="footer-text"></p>
    </div>
  </footer>

  <!-- Project detail overlay -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="document">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
